[project]
name = "aiobs-contracts"
version = "0.1.0"
description = "Shared SDK <-> backend contract: attribute names, failure taxonomy, redaction rules, classification hints (single source of truth)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Tudor Oprea", email = "133231902+Tudor230@users.noreply.github.com" },
]
keywords = ["observability", "opentelemetry", "openinference", "contracts"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/Tudor230/ai-observability-platform"
Repository = "https://github.com/Tudor230/ai-observability-platform"
Issues = "https://github.com/Tudor230/ai-observability-platform/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiobs_contracts"]
