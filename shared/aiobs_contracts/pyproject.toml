[project]
name = "aiobs-contracts"
version = "0.1.0"
description = "Shared SDK <-> backend contract: attribute names, failure taxonomy, redaction rules, classification hints (single source of truth)"
requires-python = ">=3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiobs_contracts"]