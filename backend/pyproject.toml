[project]
name = "ai-observability-backend"
version = "0.1.0"
description = "Agentic Observability and FinOps Platform backend (trace processing, failure classification, cost engine, analytics, alerts, Platform API)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiobs-contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "opentelemetry-proto>=1.30",
]

[tool.uv.sources]
aiobs-contracts = { path = "../shared/aiobs_contracts", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.28",
]

[project.scripts]
aiobs-backend = "aiobs_backend.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiobs_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
