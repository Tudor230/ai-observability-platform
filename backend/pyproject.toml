[project]
name = "ai-observability-backend"
version = "0.1.0"
description = "Agentic Observability and FinOps Platform backend (trace processing, failure classification, cost engine, analytics, alerts, Platform API)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiobs-contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "opentelemetry-proto>=1.30",
]

[tool.uv.sources]
aiobs-contracts = { path = "../shared/aiobs_contracts", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.28",
    "alembic>=1.19.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.14",
    "mypy>=1.15",
]

[project.scripts]
aiobs-backend = "aiobs_backend.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiobs_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated migration files keep Alembic's import layout.
"alembic/versions/*" = ["I001"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
exclude = ["alembic/"]
