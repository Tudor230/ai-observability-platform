# Dev stack: PostgreSQL (trace storage) + Phoenix (OTLP ingest + UI).
#
# Phoenix stores spans in Postgres via PHOENIX_SQL_DATABASE_URL, so traces are
# inspectable both through the Phoenix UI (http://localhost:6006) and directly
# with SQL (psql / dev/inspect_traces.py).
#
#   docker compose up -d --wait
#   uv run aiobs-mock --endpoint http://localhost:6006   # export real traces
#   uv run python dev/inspect_traces.py
#
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: phoenix
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d phoenix"]
      interval: 5s
      timeout: 3s
      retries: 20

  phoenix:
    image: arizephoenix/phoenix:latest
    environment:
      PHOENIX_SQL_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/phoenix
    ports:
      - "6006:6006"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /usr/bin/python3.13
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:6006/health', timeout=5)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s