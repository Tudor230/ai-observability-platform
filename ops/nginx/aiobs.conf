# Public entry point for aiobs.tudoroprea.me (single-machine deployment).
#
# TLS is terminated by Cloudflare; cloudflared forwards to this vhost over
# loopback HTTP, so there is no certificate here. Install with:
#
#   sudo cp ops/nginx/aiobs.conf /etc/nginx/sites-available/aiobs.conf
#   sudo ln -sf ../sites-available/aiobs.conf /etc/nginx/sites-enabled/aiobs.conf
#   sudo nginx -t && sudo systemctl reload nginx

upstream aiobs_backend {
    server 127.0.0.1:8000;
}

upstream aiobs_dashboard {
    server 127.0.0.1:8080;
}

server {
    listen 127.0.0.1:8081;
    server_name aiobs.tudoroprea.me;

    # OTLP batches; keep >= AIOBS_MAX_INGEST_BYTES (default 10 MiB).
    client_max_body_size 10m;

    # Ingest goes straight to the backend: the dashboard container's nginx
    # does not route /v1/traces, and caps bodies at 1 MiB by default.
    location = /v1/traces {
        proxy_pass http://aiobs_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/v1/traces {
        proxy_pass http://aiobs_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /health {
        proxy_pass http://aiobs_backend/health;
        proxy_set_header Host $host;
    }

    # Dashboard SPA + Platform API. The dashboard container's nginx proxies
    # /api/ on to the backend over the compose network.
    location / {
        proxy_pass http://aiobs_dashboard;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
